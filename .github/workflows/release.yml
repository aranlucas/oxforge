name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but skip npm publish and the GitHub Release"
        required: false
        default: true
        type: boolean

# Never cancel a running publish, and keep queued tag pushes instead of
# dropping all but the newest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      already_published: ${{ steps.registry.outputs.already_published }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        name: Resolve release version
        shell: bash
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"

          # The tag is the release trigger; package.json is what npm sees.
          # Refuse to publish when they disagree.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump package.json, commit, and tag v$version." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $version" >&2
            exit 1
          fi

          # Prereleases (1.2.3-beta.1) go to `next` so `npm install` never
          # resolves them by default.
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Lets a failed run be re-run after npm already accepted the package:
      # publish is skipped and the GitHub Release still gets created.
      - id: registry
        name: Check npm for existing version
        shell: bash
        env:
          SPEC: ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}
        run: |
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "::notice::$SPEC is already on npm; publish will be skipped."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC trusted publishing; also signs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3

      - name: Check
        run: pnpm check

      # Publishing the packed tarball means npm gets exactly the bytes attached
      # to the GitHub Release, and prepublishOnly does not re-run the check.
      - id: pack
        name: Pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          tarball="$(ls "$RUNNER_TEMP"/package/*.tgz)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Validates the tarball and publish arguments. It does not authenticate,
      # so a missing trusted publisher only shows up in the real publish.
      - name: Publish (dry run)
        run: pnpm publish "${{ steps.pack.outputs.tarball }}" --tag "${{ needs.preflight.outputs.dist_tag }}" --no-git-checks --dry-run

      - name: Publish
        if: github.event_name == 'push' && needs.preflight.outputs.already_published != 'true'
        run: |
          if ! pnpm publish "${{ steps.pack.outputs.tarball }}" --tag "${{ needs.preflight.outputs.dist_tag }}" --no-git-checks; then
            echo "::error::pnpm publish failed. If this is an auth error, make sure the package has a trusted publisher registered for .github/workflows/release.yml (see docs/releasing.md)." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease != 'true' }}
          files: package/*.tgz
          fail_on_unmatched_files: true
