name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true
          runtime: node@24
      - name: Demonstrate dangling-config regression against the audit baseline
        shell: bash
        run: |
          git show 40d3e1f97297071a1a7de4b090370b193583d325:bin/oxforge.js > bin/oxforge.js
          if pnpm exec vitest run --project unit test/init-conflicts.test.mjs --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/init-baseline.xml"; then
            echo "Expected the baseline initializer to fail the dangling-config regressions."
            exit 1
          fi
          python -c 'import sys, xml.etree.ElementTree as ET; cases = ET.parse(sys.argv[1]).findall(".//testcase"); assert len(cases) == 8; assert all(case.find("failure") is not None for case in cases)' "$RUNNER_TEMP/init-baseline.xml"
          git restore --source=HEAD -- bin/oxforge.js
      - name: Verify current implementation
        shell: bash
        run: pnpm check 2>&1 | tee reliability-check.log
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reliability-check
          path: reliability-check.log
          if-no-files-found: ignore
      - name: Upload CLI journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-e2e
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: ignore
